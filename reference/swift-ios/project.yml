name: Exochronometer
options:
  bundleIdPrefix: com.alchemicav
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Pinned here (not in Xcode's UI) so `xcodegen generate` can't reset it to
    # none. A stable Apple Development identity also keeps the macOS Screen
    # Recording (TCC) grant from resetting on every rebuild.
    DEVELOPMENT_TEAM: "appi.jaycee@icloud.com"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ExochronometerCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - ExochronometerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer.Core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  Exochronometer:
    type: application
    platform: iOS
    sources:
      - Exochronometer
    dependencies:
      - target: ExochronometerCore
        embed: true
      - target: ExochronometerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer
        INFOPLIST_FILE: Exochronometer/Info.plist
        CODE_SIGN_ENTITLEMENTS: Exochronometer/Exochronometer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  ExochronometerWidget:
    type: app-extension
    platform: iOS
    sources:
      - ExochronometerWidget
    dependencies:
      - target: ExochronometerCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer.Widget
        INFOPLIST_FILE: ExochronometerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExochronometerWidget/ExochronometerWidget.entitlements

  ExochronometerMac:
    type: application
    platform: macOS
    sources:
      - ExochronometerMac
    dependencies:
      - target: ExochronometerCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alchemicav.exochronometer.Mac
        INFOPLIST_FILE: ExochronometerMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExochronometerMac/ExochronometerMac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Exochronometer:
    build:
      targets:
        Exochronometer: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ExochronometerWidget:
    build:
      targets:
        ExochronometerWidget: all
        Exochronometer: [run]
    run:
      config: Debug
      executable: Exochronometer
      environmentVariables:
        - variable: _XCWidgetKind
          value: HomeChronometerWidget
          isEnabled: true
        - variable: _XCWidgetFamily
          value: systemSmall
          isEnabled: true
        - variable: _XCWidgetDefaultView
          value: timeline
          isEnabled: true
  ExochronometerMac:
    build:
      targets:
        ExochronometerMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
